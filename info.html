<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Info • APB</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            background: #07070c;
            overflow-x: hidden;
        }

        .background {
            position: fixed;
            inset: 0;
            z-index: -10;
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(109, 40, 217, 0.2),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 40%,
                    rgba(37, 99, 235, 0.18),
                    transparent 30%
                ),
                #07070c;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 18px 7%;

            background: rgba(7, 7, 12, 0.65);
            backdrop-filter: blur(18px);

            border-bottom: 1px solid rgba(255,255,255,0.07);
        }

        .logo {
            font-size: 1.35rem;
            font-weight: 800;
        }

        .logo span {
            color: #8b5cf6;
        }

        nav a {
            color: #aaa;
            text-decoration: none;
            transition: 0.25s;
        }

        nav a:hover {
            color: white;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 150px 25px 80px;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: clamp(3rem, 8vw, 5rem);

            background: linear-gradient(
                90deg,
                #fff,
                #a78bfa,
                #60a5fa
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header p {
            color: #888;
            margin-top: 15px;
            font-size: 1.1rem;
        }

        .about {
            padding: 30px;

            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;

            margin-bottom: 25px;
        }

        .about h2 {
            margin-bottom: 12px;
        }

        .about p {
    color: #999;
    line-height: 1.7;
    white-space: pre-line;
}

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            margin-top: 20px;

            padding: 8px 14px;

            border-radius: 999px;

            background: rgba(74, 222, 128, 0.08);
            border: 1px solid rgba(74, 222, 128, 0.2);

            color: #86efac;
        }

        .status-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #4ade80;
            box-shadow: 0 0 12px #4ade80;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            padding: 25px;

            border-radius: 18px;

            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);

            transition: 0.25s;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(139,92,246,0.4);
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            color: #888;
            line-height: 1.6;
        }

        .links {
            margin-top: 35px;

            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .links a {
            padding: 12px 20px;

            border-radius: 12px;

            color: white;
            text-decoration: none;

            background: rgba(139,92,246,0.15);
            border: 1px solid rgba(139,92,246,0.25);

            transition: 0.25s;
        }

        .links a:hover {
            background: rgba(139,92,246,0.3);
            transform: translateY(-2px);
        }

        .back {
            display: block;
            margin-top: 50px;

            text-align: center;

            color: #777;
            text-decoration: none;
        }

        .back:hover {
            color: white;
        }

        @media (max-width: 750px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="background"></div>

    <nav>
        <div class="logo">
            APB<span>.</span>
        </div>

        <a href="index.html">← Tilbage</a>
    </nav>

    <main>

        <div class="header">
            <h1 id="name">APB</h1>
            <p>Information</p>
        </div>

        <div class="about">

            <h2>💨 Puffs</h2>

            <p id="about">
                Loader...
            </p>

            <div class="status">
                <span class="status-dot"></span>
                <span id="status">Loader...</span>
            </div>

        </div>


        <a class="back" href="index.html">
            ← Tilbage til forsiden
        </a>

    </main>

    <script src="config.js"></script>

    <script>

        document.getElementById("name").textContent =
            siteConfig.navn;

        document.getElementById("about").textContent =
            siteConfig.om;

        document.getElementById("status").textContent =
            siteConfig.status;


        const infoContainer =
            document.getElementById("infoCards");

        siteConfig.info.forEach(item => {

            const card = document.createElement("div");

            card.className = "card";

            card.innerHTML = `
                <h3>${item.titel}</h3>
                <p>${item.tekst}</p>
            `;

            infoContainer.appendChild(card);
        });


        const linksContainer =
            document.getElementById("links");

        siteConfig.links.forEach(link => {

            const a = document.createElement("a");

            a.href = link.url;
            a.textContent = link.navn;
            a.target = "_blank";

            linksContainer.appendChild(a);
        });

    </script>

</body>
</html>
